[project]
name = "kkday-qa-platform-mcp"
version = "0.1.0"
description = "MCP server wrapping KKday QA Test Platform /testtool endpoints — create/copy product, create order, redeem voucher, extend calendar."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "requests>=2.31.0",
]

[project.scripts]
kkday-qa-platform-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
